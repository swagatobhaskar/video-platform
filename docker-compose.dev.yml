services:

  # You don't need to repeat redis, database, etc. because they'll be inherited from the base Compose file.

  # ============================================================
  # Backend - Development
  # ============================================================
  backend:
    volumes:
      - ./video-api:/app  # bind mount to application code during development
    working_dir: /app
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # also correct
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0",
        "--port", "8000", "--reload"
      ]
    ports:
      - "8000:8000"

  # ============================================================
  # Celery - Development
  # ============================================================
  celery:
    volumes:
      - ./video-api:/app  # bind mount to application code during development
    working_dir: /app
    # command: celery -A app.workers.celery_worker.celery worker --loglevel=info -Q default  # may be not required in .dev.yml
      # [
      #   "celery", "-A", "app.celery_app", "worker", "--loglevel=info"
      # ]

  # ============================================================
  # Outbox-worker - Development
  # ============================================================
  outbox_worker:
    volumes:
      - ./video-api:/app
    working_dir: /app

  # ============================================================
  # Flower - Development
  # ============================================================
  flower:
    volumes:
      - ./video-api:/app
    working_dir: /app

  # ============================================================
  # Frontend - Development
  # ============================================================
  frontend:
    build:
      context: ./video-ui
      dockerfile: Dockerfile.dev

    volumes:
      # Development needs live source-code synchronization, and a bind mount is one way to achieve that.
      - ./video-ui:/app   # bind mount to application code during development
      - frontend_node_modules:/app/node_modules  # Docker applies the more specific /app/node_modules mount over the /app bind mount.
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      # - "3000:3000"
      - "3000:5173"  # Vite dev server runs on 5173 by default, but we can map it to 3000 for convenience.

  # ============================================================
  # Nginx - Development
  # ============================================================
  nginx:
    ports:
      - "80:80"

volumes:
  frontend_node_modules: